<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Smart Parking System</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            z-index: -1;
            overflow: hidden;
        }

        .admin-icon {
            position: absolute;
            opacity: 0.08;
            font-size: 120px;
            animation: rotate 20s linear infinite;
        }

        .admin-icon:nth-child(1) { top: 5%; left: 10%; }
        .admin-icon:nth-child(2) { top: 50%; right: 5%; animation-direction: reverse; }
        .admin-icon:nth-child(3) { bottom: 10%; left: 20%; }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            max-width: 500px;
            width: 100%;
            z-index: 1;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 60px 45px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.8s ease-out;
            width: 100%;
            max-width: 480px;
            border-top: 5px solid #2a5298;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .admin-logo {
            font-size: 60px;
            margin-bottom: 20px;
            animation: adminPulse 2.5s ease-in-out infinite;
        }

        @keyframes adminPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .login-card h1 {
            color: #1e3c72;
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .login-card h2 {
            color: #2a5298;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .security-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #1e3c72;
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            font-size: 18px;
            color: #2a5298;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.1);
            background: #f8fbff;
        }

        .form-group input::placeholder {
            color: #cbd5e1;
        }

        .btn-block {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary.btn-block {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            box-shadow: 0 10px 25px rgba(42, 82, 152, 0.3);
        }

        .btn-primary.btn-block:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(42, 82, 152, 0.4);
        }

        .btn-primary.btn-block:active {
            transform: translateY(-1px);
        }

        .message {
            margin-top: 18px;
            padding: 13px 16px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            display: none;
            border-left: 4px solid;
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
            border-left-color: #10b981;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border-left-color: #ef4444;
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #e2e8f0;
        }

        .login-footer a {
            color: #2a5298;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .login-footer a:hover {
            color: #667eea;
            transform: translateX(5px);
        }

        .admin-features {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e2e8f0;
        }

        .feature {
            flex: 1;
            text-align: center;
        }

        .feature-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .feature-name {
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 35px 25px;
                border-top-width: 3px;
            }
            .login-card h1 { font-size: 26px; }
            .admin-logo { font-size: 45px; }
        }
    </style>
</head>
<body>
    <div class="login-background">
        <div class="admin-icon">⚙️</div>
        <div class="admin-icon">🛡️</div>
        <div class="admin-icon">🔐</div>
    </div>

    <div class="container">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="admin-logo">⚙️</div>
                    <h1>Smart Parking</h1>
                    <h2>Admin Portal</h2>
                    <p class="subtitle">Central Management System</p>
                    <div class="security-badge">🔒 Secure Access Only</div>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">👤 Admin Username</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" id="username" name="username" required 
                                   placeholder="Enter admin username" autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">🔐 Secure Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔐</span>
                            <input type="password" id="password" name="password" required 
                                   placeholder="Enter your password" autocomplete="current-password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Access Admin Panel</button>
                </form>

                <div id="message" class="message"></div>

                <div class="login-footer">
                    <a href="../user/entry.html">→ User Portal</a>
                </div>

                <div class="admin-features">
                    <div class="feature">
                        <div class="feature-icon">📊</div>
                        <div class="feature-name">Dashboard</div>
                    </div>
                    <div class="feature">
                        <div class="feature-icon">🅿️</div>
                        <div class="feature-name">Slot Mgmt</div>
                    </div>
                    <div class="feature">
                        <div class="feature-icon">⚠️</div>
                        <div class="feature-name">Alerts</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const messageDiv = document.getElementById('message');

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);

            try {
                const response = await fetch('../../backend/api/admin.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (result.success) {
                    if (result.token) {
                        localStorage.setItem('adminToken', result.token);
                    }
                    showMessage('✓ Access Granted! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'welcome.html';
                    }, 1200);
                } else {
                    showMessage('✗ ' + (result.message || 'Access Denied'), 'error');
                }
            } catch (error) {
                showMessage('✗ An error occurred. Please try again.', 'error');
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
