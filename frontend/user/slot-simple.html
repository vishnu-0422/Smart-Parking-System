<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Parking Slot - Smart Parking System</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .slots-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }
        .slot-card {
            background: #f0f9ff;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .slot-card:hover {
            background: #e0f2fe;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .slot-card.selected {
            background: #3b82f6;
            color: white;
            border-color: #1e40af;
        }
        .slot-card.occupied {
            background: #fee2e2;
            border-color: #dc2626;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .slot-number {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .slot-type {
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        .slot-price {
            font-size: 1.1em;
            color: #059669;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .slot-card.selected .slot-price {
            color: #fbbf24;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-book {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            flex: 1;
            transition: background 0.3s;
        }
        .btn-book:hover {
            background: #059669;
        }
        .btn-cancel {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
        }
        .btn-cancel:hover {
            background: #dc2626;
        }
        .info-message {
            background: #d1fae5;
            color: #065f46;
            padding: 12px;
            border-radius: 6px;
            margin: 12px 0;
            border-left: 4px solid #10b981;
        }
        .error-message {
            background: #fee2e2;
            color: #7f1d1d;
            padding: 12px;
            border-radius: 6px;
            margin: 12px 0;
            border-left: 4px solid #dc2626;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Smart Parking System</h1>
            <nav>
                <a href="entry.html">Entry</a>
                <a href="slot.html" class="active">Select Slot</a>
                <a href="exit.html">Exit</a>
            </nav>
        </header>

        <main>
            <div class="card">
                <h2>Select Your Parking Slot</h2>
                
                <div id="vehicleInfo" style="background: #f3f4f6; padding: 15px; border-radius: 6px; margin-bottom: 20px;"></div>

                <div id="message"></div>

                <div id="slotsSection" style="display: none;">
                    <h3>Available Parking Slots</h3>
                    <p style="color: #666; margin-bottom: 15px;">Click on a slot to select it, then click the "Book Now" button</p>
                    <div id="slotsList" class="slots-container"></div>
                </div>

                <div id="noSlotsMessage" class="error-message" style="display: none; text-align: center;">
                    No available slots at this moment. Please try again later.
                </div>

                <div id="loadingMessage" class="info-message" style="text-align: center;">
                    Loading slots...
                </div>
            </div>
        </main>
    </div>

    <script>
        let vehicleId = new URLSearchParams(window.location.search).get('vehicleId') || sessionStorage.getItem('vehicleId');
        let selectedSlotId = null;

        // Load vehicle info
        async function loadVehicleInfo() {
            if (!vehicleId) {
                document.getElementById('vehicleInfo').innerHTML = `
                    <div style="color: #7f1d1d; background: #fee2e2; padding: 12px; border-radius: 6px;">
                        <strong>Error:</strong> No vehicle registered. <a href="entry.html" style="color: #dc2626; text-decoration: underline;">Go back to register a vehicle</a>
                    </div>
                `;
                document.getElementById('loadingMessage').style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`../../backend/api/entry.php?vehicleId=${vehicleId}`);
                const result = await response.json();
                
                if (result.success) {
                    const vehicle = result.vehicle;
                    document.getElementById('vehicleInfo').innerHTML = `
                        <p><strong>Vehicle:</strong> ${vehicle.vehicle_number}</p>
                        <p><strong>Type:</strong> ${vehicle.vehicle_type}</p>
                        <p><strong>Owner:</strong> ${vehicle.owner_name}</p>
                    `;
                    loadSlots();
                } else {
                    document.getElementById('vehicleInfo').innerHTML = '<div class="error-message">Failed to load vehicle information</div>';
                    document.getElementById('loadingMessage').style.display = 'none';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('vehicleInfo').innerHTML = '<div class="error-message">Error loading vehicle information</div>';
                document.getElementById('loadingMessage').style.display = 'none';
            }
        }

        // Load all available slots
        async function loadSlots() {
            try {
                const response = await fetch('../../backend/api/slot.php?action=getAvailable');
                const result = await response.json();
                
                document.getElementById('loadingMessage').style.display = 'none';

                if (result.success && result.slots && result.slots.length > 0) {
                    displaySlots(result.slots);
                    document.getElementById('slotsSection').style.display = 'block';
                } else {
                    document.getElementById('noSlotsMessage').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading slots:', error);
                document.getElementById('loadingMessage').innerHTML = '<div class="error-message">Error loading slots. Please try again.</div>';
            }
        }

        // Display slots as clickable cards
        function displaySlots(slots) {
            const slotsList = document.getElementById('slotsList');
            slotsList.innerHTML = '';

            slots.forEach(slot => {
                const card = document.createElement('div');
                card.className = 'slot-card';
                card.id = `slot-${slot.id}`;
                
                card.innerHTML = `
                    <div class="slot-number">${slot.slot_number}</div>
                    <div class="slot-type">${slot.slot_type.charAt(0).toUpperCase() + slot.slot_type.slice(1)}</div>
                    <div class="slot-price">₹${parseFloat(slot.price_per_hour).toFixed(2)}/hr</div>
                    <div class="action-buttons">
                        <button class="btn-book" onclick="selectAndBook(${slot.id}, '${slot.slot_number}', ${slot.price_per_hour})">
                            Book Now
                        </button>
                    </div>
                `;

                slotsList.appendChild(card);
            });
        }

        // Select slot and immediately proceed to booking
        async function selectAndBook(slotId, slotNumber, price) {
            if (!vehicleId) {
                document.getElementById('message').innerHTML = '<div class="error-message">Vehicle ID not found. Please register again.</div>';
                return;
            }

            document.getElementById('message').innerHTML = '<div class="info-message">Booking slot ' + slotNumber + '...</div>';

            try {
                const response = await fetch('../../backend/api/slot.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'assign',
                        vehicleId: vehicleId,
                        slotId: slotId
                    })
                });

                const result = await response.json();

                if (result.success) {
                    document.getElementById('message').innerHTML = '<div class="info-message">Slot booked successfully! Redirecting to payment...</div>';
                    setTimeout(() => {
                        window.location.href = `payment.html?vehicleId=${vehicleId}&slotId=${slotId}`;
                    }, 1500);
                } else {
                    document.getElementById('message').innerHTML = '<div class="error-message">Failed to book slot: ' + result.message + '</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('message').innerHTML = '<div class="error-message">Error booking slot. Please try again.</div>';
            }
        }

        // Initialize
        loadVehicleInfo();
    </script>
</body>
</html>
